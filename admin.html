<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Manager - Sam Lustig Photo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .drag-over {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full space-y-8">
            <div class="text-center">
                <h2 class="text-3xl font-bold text-gray-900">Gallery Manager</h2>
                <p class="mt-2 text-gray-600">Sign in to manage your galleries</p>
            </div>
            <form id="login-form" class="mt-8 space-y-6 bg-white p-8 rounded-lg shadow">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div id="login-error" class="hidden text-red-600 text-sm"></div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Panel (hidden by default) -->
    <div id="admin-panel" class="hidden">
        <header class="bg-white shadow-sm border-b">
            <nav class="mx-auto flex max-w-7xl items-center justify-between p-6 lg:px-8">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2 rounded-lg">
                        <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900">Gallery Manager</h1>
                        <p class="text-sm text-gray-500">Manage your photography portfolio</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-email" class="text-sm text-gray-600"></span>
                    <button id="logout-btn" class="text-sm font-semibold text-red-600 hover:text-red-500">Sign Out</button>
                    <a href="/" class="text-sm font-semibold text-blue-600 hover:text-blue-500 flex items-center space-x-1">
                        <span>Back to Site</span>
                    </a>
                </div>
            </nav>
        </header>

        <div class="mx-auto max-w-7xl px-6 py-8 lg:px-8">
            <div class="mb-8">
                <button id="new-gallery-btn" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                    Create New Gallery
                </button>
            </div>

            <div id="galleries-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="empty-state" class="hidden text-center py-16">
                <p class="text-gray-500">No galleries yet. Create your first gallery to get started.</p>
            </div>
        </div>
    </div>

    <!-- Gallery Modal -->
    <div id="gallery-modal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between p-6 border-b">
                <h2 id="modal-title" class="text-2xl font-bold text-gray-900">Create Gallery</h2>
                <button id="close-modal" class="text-gray-400 hover:text-gray-600">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="p-6">
                <form id="gallery-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Title</label>
                        <input type="text" id="gallery-title" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Category</label>
                        <select id="gallery-category" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                            <option value="event">Event Photography</option>
                            <option value="portrait">Professional Headshots</option>
                            <option value="wedding">Wedding Photography</option>
                            <option value="commercial">Commercial Photography</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Description</label>
                        <textarea id="gallery-description" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                    <div>
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" id="gallery-featured" class="rounded border-gray-300">
                            <span class="text-sm text-gray-700">Feature on homepage</span>
                        </label>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Image URLs (one per line)</label>
                        <textarea id="gallery-images" rows="6" placeholder="images/gallery1.jpg&#10;images/gallery2.jpg"
                                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md font-mono text-sm"></textarea>
                        <p class="mt-1 text-xs text-gray-500">Enter relative paths from project root</p>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" id="cancel-btn" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50">Cancel</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Save Gallery</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        const { createClient } = supabase;
        const supabaseUrl = 'https://jgjvwzztgoyzsxwzeyaf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnanZ3enp0Z295enN4d3pleWFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk5MTU2OTEsImV4cCI6MjA3NTQ5MTY5MX0.-XNJUk1ygVlzRVM4ukK4ye2liw7r6uqLNosn9l-Dd0E';
        const sb = createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let galleries = [];
        let editingId = null;

        async function checkAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                currentUser = session.user;
                showAdminPanel();
                await loadGalleries();
            } else {
                showLoginScreen();
            }
        }

        function showLoginScreen() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
        }

        function showAdminPanel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            const emailEl = document.getElementById('user-email');
            emailEl.textContent = currentUser?.email || '';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');

            const { error } = await sb.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
            } else {
                await checkAuth();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await sb.auth.signOut();
            showLoginScreen();
        });

        async function loadGalleries() {
            const { data, error } = await sb.from('galleries').select('*').order('created_at', { ascending: false });

            if (error) {
                console.error('Error loading galleries:', error);
                galleries = [];
            } else {
                galleries = data || [];
            }

            displayGalleries();
        }

        function displayGalleries() {
            const grid = document.getElementById('galleries-grid');
            const emptyState = document.getElementById('empty-state');

            if (galleries.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');
            grid.textContent = '';

            galleries.forEach(gallery => {
                const card = createGalleryCard(gallery);
                grid.appendChild(card);
            });
        }

        function createGalleryCard(gallery) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl shadow-sm border overflow-hidden';

            const imageUrl = gallery.images?.[0]?.src || '';

            const img = document.createElement('img');
            img.src = imageUrl;
            img.alt = gallery.title;
            img.className = 'w-full h-48 object-cover';
            img.onerror = () => {
                img.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2Y5ZmFmYiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjOTk5Ij5ObyBJbWFnZTwvdGV4dD48L3N2Zz4=';
            };

            const content = document.createElement('div');
            content.className = 'p-4';

            const title = document.createElement('h3');
            title.className = 'font-semibold text-gray-900';
            title.textContent = gallery.title;

            const category = document.createElement('p');
            category.className = 'text-sm text-gray-600 mt-1';
            category.textContent = gallery.category;

            const buttons = document.createElement('div');
            buttons.className = 'flex space-x-2 mt-4';

            const editBtn = document.createElement('button');
            editBtn.textContent = 'Edit';
            editBtn.className = 'flex-1 bg-blue-50 text-blue-600 px-3 py-2 rounded text-sm hover:bg-blue-100';
            editBtn.onclick = () => editGallery(gallery);

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.className = 'flex-1 bg-red-50 text-red-600 px-3 py-2 rounded text-sm hover:bg-red-100';
            deleteBtn.onclick = () => deleteGallery(gallery.id);

            buttons.appendChild(editBtn);
            buttons.appendChild(deleteBtn);
            content.appendChild(title);
            content.appendChild(category);
            content.appendChild(buttons);
            card.appendChild(img);
            card.appendChild(content);

            return card;
        }

        function openModal(gallery = null) {
            const modal = document.getElementById('gallery-modal');
            const title = document.getElementById('modal-title');

            if (gallery) {
                title.textContent = 'Edit Gallery';
                editingId = gallery.id;
                document.getElementById('gallery-title').value = gallery.title;
                document.getElementById('gallery-category').value = gallery.category;
                document.getElementById('gallery-description').value = gallery.description || '';
                document.getElementById('gallery-featured').checked = gallery.featured || false;
                document.getElementById('gallery-images').value = gallery.images.map(img => img.src).join('\n');
            } else {
                title.textContent = 'Create Gallery';
                editingId = null;
                document.getElementById('gallery-form').reset();
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('gallery-modal').classList.add('hidden');
            document.getElementById('gallery-form').reset();
            editingId = null;
        }

        document.getElementById('new-gallery-btn').addEventListener('click', () => openModal());
        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('cancel-btn').addEventListener('click', closeModal);

        document.getElementById('gallery-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('gallery-title').value.trim();
            const category = document.getElementById('gallery-category').value;
            const description = document.getElementById('gallery-description').value.trim();
            const featured = document.getElementById('gallery-featured').checked;
            const imagesText = document.getElementById('gallery-images').value;

            const images = imagesText.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .map((src, index) => ({
                    id: `${Date.now()}-${index}`,
                    src: src,
                    alt: `${title} - Image ${index + 1}`,
                    width: 1200,
                    height: 800
                }));

            if (images.length === 0) {
                alert('Please add at least one image URL');
                return;
            }

            const galleryData = {
                title,
                description,
                category,
                images,
                featured
            };

            let error;
            if (editingId) {
                const result = await sb.from('galleries').update(galleryData).eq('id', editingId);
                error = result.error;
            } else {
                const result = await sb.from('galleries').insert([galleryData]);
                error = result.error;
            }

            if (error) {
                alert('Error saving gallery: ' + error.message);
            } else {
                closeModal();
                await loadGalleries();
            }
        });

        function editGallery(gallery) {
            openModal(gallery);
        }

        async function deleteGallery(id) {
            if (!confirm('Are you sure you want to delete this gallery?')) return;

            const { error } = await sb.from('galleries').delete().eq('id', id);

            if (error) {
                alert('Error deleting gallery: ' + error.message);
            } else {
                await loadGalleries();
            }
        }

        checkAuth();
    </script>
</body>
</html>
